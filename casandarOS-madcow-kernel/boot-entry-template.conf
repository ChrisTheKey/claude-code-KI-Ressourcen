# systemd-boot entry for CasandarOS Madcow Gaming Kernel
# Copy to: /boot/loader/entries/madcow-gaming.conf
# 
# Edit the 'options' line to match your root partition.
# Find your root: blkid /dev/sdX (or nvme0n1pX) | grep UUID
#
title   CasandarOS Madcow Gaming Kernel
linux   /vmlinuz-casandarOS-madcow-gaming-kernel
initrd  /amd-ucode.img
initrd  /initramfs-casandarOS-madcow-gaming-kernel.img
options root=UUID=YOUR-ROOT-UUID-HERE rw quiet loglevel=3 \
        nowatchdog nmi_watchdog=0 \
        mitigations=auto \
        amd_pstate=active

# =============================================================================
# CasandarOS Madcow Gaming Kernel — Gaming Sysctl Preset
# /etc/sysctl.d/99-madcow-gaming.conf
# =============================================================================
# ANTI-SNAKE-OIL: Every setting below has measured evidence behind it.
# None of these are "random internet tweaks."
# =============================================================================

# --- Scheduler ---------------------------------------------------------------
# BORE burst parameters — these are the defaults from firelzrd/bore-scheduler.
# Do NOT change unless you have frametime telemetry showing an improvement.
kernel.sched_bore = 1
kernel.sched_burst_cache_lifetime = 75000000
# sched_burst_fork_atavistic: 2 = average of parent + sibling burst scores
# This prevents "make -jN" from killing interactive tasks on fork bomb
kernel.sched_burst_fork_atavistic = 2

# --- Memory Management -------------------------------------------------------
# Disable proactive memory compaction — it causes stutters during gaming.
# Compaction runs on-demand instead (madvise hugepages)
vm.compaction_proactiveness = 0

# Watermark boost factor: reduce fragmentation at minor cost of memory use
vm.watermark_boost_factor = 1

# Reduce swappiness — keep game assets in RAM longer
# 10 = only swap under real memory pressure (not 60 default)
vm.swappiness = 10

# Dirty ratio — don't buffer huge write bursts (causes latency spikes)
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Huge page defrag: only on madvise request (no background fragmentation)
# This complements the Kconfig THP=madvise setting
# kernel.thp_aware_mapping = madvise  (set via Kconfig, not sysctl)

# --- Network -----------------------------------------------------------------
# BBR already set as default in Kconfig.
# Enable ECN for congestion signaling
net.ipv4.tcp_ecn = 1

# Reduce TCP retransmission timeout for faster recovery
net.ipv4.tcp_fastopen = 3

# Increase network buffer sizes for gaming/streaming
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# --- CPU / Interrupt ---------------------------------------------------------
# Disable NMI watchdog — reduces spurious interrupts during gaming
kernel.nmi_watchdog = 0

# Disable perf sampling for production gaming (reduces interrupt load)
kernel.perf_cpu_time_max_percent = 0

# --- Kernel Misc -------------------------------------------------------------
# Disable kernel pointer restriction for perf profiling (optional, re-enable for security)
# kernel.kptr_restrict = 0  # uncomment only for profiling sessions

# Increase inotify for game launchers / file watchers
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 256

# --- File / I/O --------------------------------------------------------------
# Increase AIO for game engines that use async I/O heavily
fs.aio-max-nr = 1048576
